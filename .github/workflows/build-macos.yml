name: Build (macOS)

on:
  push:
    branches: [master, main]
    tags: [v*]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jnx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jnx/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            jnx/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('jnx/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm deps
        run: npm ci

      - name: Build Tauri app (macOS arm64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: jnx
          tagName: v0.1.${{ github.run_number }}
          releaseName: 'JNX v0.1.${{ github.run_number }}'
          releaseBody: 'JNX v0.1.${{ github.run_number }} - see assets to download.'
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Build Tauri app (macOS x86_64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: jnx
          tagName: v0.1.${{ github.run_number }}
          releaseName: 'JNX v0.1.${{ github.run_number }}'
          releaseBody: 'JNX v0.1.${{ github.run_number }} - see assets to download.'
          releaseDraft: true
          prerelease: false
          args: --target x86_64-apple-darwin

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jnx-macos
          path: |
            jnx/src-tauri/target/*/release/bundle/**/*.dmg
            jnx/src-tauri/target/*/release/bundle/**/*.app
          if-no-files-found: warn
